<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CBSystem Employee Management - Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<script>window.CBS_API='https://yjdmjhxnvsdlevfwuxvh.supabase.co/functions/v1/cbs-hol';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0d0d0f;--card:#17171b;--in:#0f0f12;--bd:#2a2a31;--ac:#ff7a1a;--tx:#ececf0;--t2:#8d8d99;--gr:#3ecf8e;--rd:#ff5d5d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 'DM Sans',system-ui,sans-serif;padding:22px 16px 60px;max-width:860px;margin:0 auto}
h1{font:400 2.2rem 'Bebas Neue',Impact,sans-serif;letter-spacing:2px}
h1 span{color:var(--ac)}
h2{font-size:.95rem;margin-bottom:10px}
.sub{color:var(--t2);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin:8px 0 4px}
input,textarea{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;min-height:230px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
button{border:0;border-radius:8px;padding:9px 15px;font:700 .8rem 'DM Sans',sans-serif;cursor:pointer;background:var(--ac);color:#111;margin-top:12px}
button:disabled{opacity:.5;cursor:not-allowed}
button.o{background:transparent;border:1px solid var(--bd);color:var(--tx);margin:0;padding:5px 10px;font-size:.72rem}
button.o:hover{border-color:var(--ac)}
button.d{border-color:var(--rd);color:var(--rd)}
button.d:hover{background:var(--rd);color:#fff}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--bd);font-size:.8rem}
th{border:0;color:var(--t2);font-size:.7rem}
td.act{display:flex;gap:6px;flex-wrap:wrap}
.on{color:var(--gr)}.off{color:var(--rd)}
#msg{margin-top:10px;min-height:20px;font-weight:600}.err{color:var(--rd)}.ok{color:var(--gr)}
.hide{display:none}
</style></head>
<body>
<h1>CBSystem <span>Employee Management</span></h1>
<p class="sub">Admin - create and manage businesses</p>

<div class="card" id="login">
  <h2>Admin key</h2>
  <label for="ak">The ADMIN_KEY saved in your Supabase secrets</label>
  <input id="ak" type="password" autocomplete="off">
  <button id="go">Connect</button>
</div>

<div id="app" class="hide">
  <div class="card">
    <h2>New business</h2>
    <div class="row">
      <div><label for="nm">Business name</label><input id="nm" placeholder="e.g. Creative Foods" autocomplete="off"></div>
      <div><label for="bid">Link name (used in the login links)</label><input id="bid" placeholder="creative-foods" autocomplete="off"></div>
    </div>
    <button id="create">Create business</button>
  </div>

  <div class="card hide" id="res">
    <h2 id="rt">Ready to send</h2>
    <p class="sub" style="margin:0 0 8px" id="rsub">The staff key and Owner PIN are shown only once. Copy them now.</p>
    <textarea id="txt" readonly></textarea>
    <div id="qr" class="hide" style="margin-top:12px;background:#fff;padding:8px;width:max-content;border-radius:6px"></div>
    <p class="sub hide" id="qrnote" style="margin:6px 0 0">Scan to open the staff login. The QR holds the link only, never the key.</p>
    <button id="copy">Copy message</button>
  </div>

  <div class="card">
    <h2>All businesses</h2>
    <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Link name</th><th>Status</th><th>People</th><th>Created</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
</div>
<div id="msg" role="status"></div>

<script>
let KEY='';
const $=id=>document.getElementById(id);
const say=(t,c)=>{$('msg').textContent=t||'';$('msg').className=c||''};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,38);
const base=()=>location.origin+location.pathname.replace(/admin\/(index\.html)?$/,'');
const staffUrl=id=>base()+'staff/?b='+encodeURIComponent(id);
const bizUrl=id=>base()+'business/?b='+encodeURIComponent(id);
const fmt=d=>d?new Date(d).toLocaleString('en-GB'):'-';

async function api(action,body){
  if(!window.CBS_API)throw new Error('The Supabase function address is missing.');
  let r;
  try{r=await fetch(CBS_API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify({action,...body})})}
  catch(e){throw new Error('Cannot reach the server. Check your connection and that the cbs-hol function is deployed.')}
  const j=await r.json().catch(()=>({ok:false,error:{message:'Unexpected reply from the server'}}));
  if(!r.ok||j.ok===false){const e=j.error;throw new Error((e&&e.message)||(typeof e==='string'?e:'')||('Error '+r.status))}
  return j.data!==undefined?j.data:j;
}
function showMessage(title,lines,link,sub){
  $('rt').textContent=title;
  $('rsub').textContent=sub||'The staff key and Owner PIN are shown only once. Copy them now.';
  $('txt').value=lines.join('\n');
  const q=$('qr');q.textContent='';
  const ok=link&&window.QRCode;
  q.classList.toggle('hide',!ok);$('qrnote').classList.toggle('hide',!ok);
  if(ok)new QRCode(q,{text:link,width:150,height:150});
  $('res').classList.remove('hide');$('res').scrollIntoView({behavior:'smooth'});
}

async function load(){
  const d=await api('admin.list');
  const list=d.businesses||[];
  const tb=$('tb');tb.textContent='';
  if(!list.length){const tr=tb.insertRow(),td=tr.insertCell();td.colSpan=6;td.textContent='No businesses yet. Create the first one above.';return}
  list.forEach(b=>{
    const tr=tb.insertRow();
    tr.insertCell().textContent=b.name;
    tr.insertCell().textContent=b.slug;
    const st=tr.insertCell();st.textContent=b.active?'Active':'Paused';st.className=b.active?'on':'off';
    tr.insertCell().textContent=b.employees!==undefined?b.employees:'-';
    tr.insertCell().textContent=fmt(b.created_at);
    const ac=tr.insertCell();ac.className='act';
    const mk=(label,fn,cls)=>{const x=document.createElement('button');x.className='o'+(cls?' '+cls:'');x.textContent=label;x.onclick=async()=>{try{await fn()}catch(e){say(e.message,'err')}};ac.appendChild(x)};
    mk('Details',async()=>{
      say('');
      const r=await api('admin.details',{slug:b.slug});
      showMessage('Details: '+r.name,[
        'Business: '+r.name+' ('+r.slug+')',
        'Status: '+(r.active?'Active':'Paused'),
        'Created: '+fmt(r.created_at),
        'People: '+r.employees,
        'Leave requests: '+(r.requests!==undefined?r.requests:'-'),'',
        'Staff login: '+staffUrl(r.slug),
        'Business (owner / HR) login: '+bizUrl(r.slug),'',
        'Staff key and PINs are stored hashed and cannot be shown.',
        'Use "New staff key" or "Reset owner PIN" if they are lost.'
      ],staffUrl(r.slug),'Private information. Do not share this screen.');
    });
    mk(b.active?'Pause':'Resume',async()=>{await api('admin.set_active',{slug:b.slug,active:!b.active});say(b.name+(b.active?' paused':' resumed'),'ok');load()});
    mk('New staff key',async()=>{
      if(!confirm('Make a new staff key for '+b.name+'? The old key stops working.'))return;
      const r=await api('admin.reset_staff_key',{slug:b.slug});
      showMessage('New staff key for '+b.name,['Staff login: '+staffUrl(b.slug),'New staff key: '+r.staff_key,'','Give the new key to staff. They enter it with their employee number and PIN.'],staffUrl(b.slug));
    });
    mk('Reset owner PIN',async()=>{
      if(!confirm('Reset the Owner PIN for '+b.name+'? The Owner is signed out.'))return;
      const r=await api('admin.reset_owner_pin',{slug:b.slug});
      showMessage('New Owner PIN for '+b.name,['Business login: '+bizUrl(b.slug),'Employee number: OWNER','New Owner PIN: '+r.pin],bizUrl(b.slug));
    });
    mk('Delete',async()=>{
      const t=prompt('This permanently deletes "'+b.name+'" with all its people, leave and records. It cannot be undone.\n\nType the link name ('+b.slug+') to confirm:');
      if(t===null)return;
      if(t.trim().toLowerCase()!==b.slug){say('Link name did not match. Nothing was deleted.','err');return}
      await api('admin.delete',{slug:b.slug,confirm:t.trim()});
      $('res').classList.add('hide');
      say(b.name+' deleted','ok');load();
    },'d');
  });
}

$('go').onclick=async()=>{
  KEY=$('ak').value.trim();say('');
  if(!KEY){say('Enter the admin key','err');return}
  try{await load();$('login').classList.add('hide');$('app').classList.remove('hide')}catch(e){KEY='';say(e.message,'err')}
};
$('ak').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('nm').addEventListener('input',()=>{$('bid').value=slug($('nm').value)});
$('create').onclick=async()=>{
  say('');
  try{
    const r=await api('admin.create',{name:$('nm').value.trim(),slug:$('bid').value.trim()});
    showMessage('Ready to send: '+r.name,[
      'Welcome to CBSystem Employee Management. Your system is ready.','',
      'STAFF LOGIN (employees and managers)',
      'Link: '+staffUrl(r.slug),
      'Staff key (keep private): '+r.staff_key,'',
      'BUSINESS LOGIN (owner and HR)',
      'Link: '+bizUrl(r.slug),
      'Employee number: OWNER',
      'Owner PIN: '+r.owner_pin,'',
      'First steps: sign in to the business login, change your PIN (My PIN), then go to Setup to add a leave year, a policy and a work schedule. Add your people in People and give each their PIN. Run Yearly allocation, then staff can request leave.'
    ],staffUrl(r.slug));
    $('nm').value='';$('bid').value='';load();
  }catch(e){say(e.message,'err')}
};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('txt').value);say('Message copied','ok')}catch(e){$('txt').select();say('Select the text and copy it','err')}};
</script>
</body></html>
