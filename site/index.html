<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CBSystem - Employee Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0d0f;--card:#17171b;--line:#2a2a31;--text:#ececf0;--muted:#8d8d99;--accent:#ff7a1a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  main{margin:auto;width:100%;max-width:440px;padding:24px;text-align:center}
  h1{font:400 40px 'Bebas Neue',sans-serif;letter-spacing:1px;margin:0 0 6px;line-height:1.05}
  h1 span{color:var(--accent)}
  p{color:var(--muted);margin:0 0 26px}
  a.btn{display:block;background:var(--accent);color:#111;text-decoration:none;font-weight:700;border-radius:10px;padding:16px;margin-bottom:12px}
  a.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  a.btn:hover{filter:brightness(1.1)}
  footer{text-align:right;padding:14px 22px;color:var(--accent);font:400 18px 'Bebas Neue',sans-serif;letter-spacing:1px}
</style>
</head>
<body>
<main>
  <h1>CBSystem <span>Employee Management</span></h1>
  <p>Holidays, absence and approvals for your team.</p>
  <a class="btn" href="./staff/">Staff login</a>
  <a class="btn ghost" href="./business/">Business owner or HR login</a>
</main>
<footer>CBSystem</footer>
</body>
</html>
